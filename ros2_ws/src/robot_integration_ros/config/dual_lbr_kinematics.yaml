arm_one:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # 0.005 rad caused a dense redundant-joint sweep on every failed request.
  # 0.03 preserves useful iiwa redundancy while making exhaustive fallbacks
  # substantially cheaper.
  kinematics_solver_search_resolution: 0.03
  kinematics_solver_timeout: 0.10

arm_two:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.03
  kinematics_solver_timeout: 0.10
