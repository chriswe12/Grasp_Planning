/**/servo_node:
  ros__parameters:
    moveit_servo:
      # The deployment runtime already scales policy outputs to m/s and rad/s.
      command_in_type: "speed_units"
      scale:
        linear: 1.0
        rotational: 1.0
        joint: 1.0

      publish_period: 0.005
      low_latency_mode: false
      # Reuse the joint-trajectory controller that executes the planned
      # pregrasp. This avoids switching hardware controllers at the handoff.
      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

      # move_group owns and publishes the primary planning scene. Servo monitors
      # that scene so the pregrasp planner and policy approach see the same world.
      is_primary_planning_scene_monitor: false
      move_group_name: arm
      planning_frame: lbr_link_0
      ee_frame_name: gripper_tcp
      robot_link_command_frame: lbr_link_0

      incoming_command_timeout: 0.1
      num_outgoing_halt_msgs_to_publish: 4
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margin: 0.1
      leaving_singularity_threshold_multiplier: 2.0

      cartesian_command_in_topic: ~/delta_twist_cmds
      joint_command_in_topic: ~/delta_joint_cmds
      joint_topic: /lbr/joint_states
      status_topic: ~/status
      command_out_topic: /lbr/joint_trajectory_controller/joint_trajectory

      check_collisions: true
      collision_check_rate: 30.0
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02
