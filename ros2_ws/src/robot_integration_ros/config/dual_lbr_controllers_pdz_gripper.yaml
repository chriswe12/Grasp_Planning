/**/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lbr_one_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lbr_two_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lbr_one_force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    lbr_two_force_torque_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

/**/lbr_one_joint_trajectory_controller:
  ros__parameters:
    joints:
      - lbr_one_A1
      - lbr_one_A2
      - lbr_one_A3
      - lbr_one_A4
      - lbr_one_A5
      - lbr_one_A6
      - lbr_one_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

/**/lbr_two_joint_trajectory_controller:
  ros__parameters:
    joints:
      - lbr_two_A1
      - lbr_two_A2
      - lbr_two_A3
      - lbr_two_A4
      - lbr_two_A5
      - lbr_two_A6
      - lbr_two_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

/**/lbr_one_force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_one_link_ee
    sensor_name: estimated_ft_sensor

/**/lbr_two_force_torque_broadcaster:
  ros__parameters:
    frame_id: lbr_two_link_ee
    sensor_name: estimated_ft_sensor
