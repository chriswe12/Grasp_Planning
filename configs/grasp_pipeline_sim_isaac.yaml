geometry:
  target_mesh_path: "obj/fabrica/plumbers_block/0.obj"
  mesh_scale: 0.01
  assembly_glob: "obj/fabrica/plumbers_block/*.obj"

planning:
  stage1_cache_enabled: true
  stage1_cache_dir: "artifacts/stage1_cache"
  num_surface_samples: 256
  min_jaw_width: 0.002
  max_jaw_width: 0.084
  antipodal_cosine_threshold: 0.984807753012208
  roll_angle_step_deg: 15.0
  max_pair_checks: 40960
  detailed_finger_contact_gap_m: 0.002
  gripper_collision_model: "kuka_y_gripper"
  floor_clearance_margin_m: 0.01
  top_grasp_score_weight: 0.35
  regrasp_transfer_top_grasp_score_weight: 0.70
  reachability_proxy_score_weight: 0.15
  reachability_proxy_hand_offset_m: 0.10
  contact_lateral_offsets_m: [-0.002916666666666667, 0.0, 0.002916666666666667]
  contact_approach_offsets_m: [-0.0030833333333333333, 0.0, 0.0030833333333333333]
  rng_seed: 0

execution_world_pose:
  position_world: [0.4252643585205078, 0.05988234281539917, 0.037691780279088316]
  orientation_xyzw_world: [-0.0, 0.0, -0.02874958897323683, 0.9995866451358131]

artifacts:
  stage1_json: "artifacts/pipeline_stage1_assembly_grasps.json"
  stage1_html: "artifacts/pipeline_stage1_assembly_grasps.html"
  stage2_json: "artifacts/pipeline_stage2_ground_feasible.json"
  stage2_html: "artifacts/pipeline_stage2_ground_feasible.html"

mujoco_execution:
  enabled: false
  python_executable: ""
  robot_config: "configs/mujoco_fr3_with_hand.json"
  simulation_config: "configs/mujoco_simulation.yaml"
  grasp_id: ""
  attempt_artifact: "artifacts/sim_mujoco_pick_attempt.json"
  viewer: true
  viewer_left_ui: false
  viewer_right_ui: false
  viewer_no_realtime: false
  viewer_hold_seconds: 8.0
  viewer_block_at_end: false
  keep_generated_scene: false

isaac_execution:
  enabled: true
  python_executable: "/media/pdz/Elements1/IsaacLab/isaaclab.sh -p"
  part_usd: ""  # optional; runner generates a bundle-local USD by default
  fr3_usd: "assets/usd/kuka_iiwa7_y_gripper/kuka_iiwa7_y_gripper.usda"
  controller: "moveit"
  grasp_id: "g1973"
  pregrasp_offset: 0.10
  gripper_width_clearance: 0.01
  contact_gap_m: 0.002
  lift_height_m: 0.08
  success_height_margin_m: 0.05
  close_width: 0.0
  object_mass_kg:
  object_density_kg_m3: 1240.0
  tcp_to_grasp_offset: [0.0, 0.0, 0.0]
  attempt_artifact: "artifacts/sim_isaac_pick_attempt.json"
  pregrasp_only: false
  run_seconds: 0.0
  headless: false
  d405_wrist_camera:
    enabled: true
    # Nominal 848x480 pinhole values derived from the published 84x58 degree FOV.
    # Replace these with the factory intrinsics for the deployed stream.
    width: 848
    height: 480
    fx: 470.900
    fy: 432.971
    cx: 423.5
    cy: 239.5
    # Isaac-only training label. A deployed actor must not require this channel.
    privileged_mask_enabled: true
  record_video: "artifacts/plumbers_block_0_d405_wrist.mp4"
  visual_servo_goal_image: "artifacts/plumbers_block_0_visual_servo_goal.png"
  visual_servo_comparison_video: "artifacts/plumbers_block_0_pregrasp_to_goal.mp4"
  curriculum_dataset_dir: "artifacts/curriculum_one_100_parallel"
  curriculum_episodes: 100
  curriculum_seed: 7
  # Increase by curriculum_episodes when appending a later collection chunk.
  curriculum_episode_offset: 0
  curriculum_num_envs: 16
  curriculum_writer_workers: 4
  # Run the expert at 30 Hz, but save less-correlated RGB-D labels at 10 Hz.
  curriculum_sample_hz: 10.0
  # Initial TCP perturbations for expert demonstrations. Translation is in the
  # target grasp frame; rotation is an intrinsic local XYZ offset.
  curriculum_ee_position_noise_grasp_m: [0.035, 0.035, 0.020]
  curriculum_ee_rotation_noise_deg: [20.0, 20.0, 25.0]
  curriculum_video: "artifacts/curriculum_funnel_isaac_wrist.mp4"
  video_fps: 30.0
  video_width: 848
  video_height: 480
  moveit_frame_id: "lbr_link_0"
  moveit_target_position_signs: [1.0, 1.0, 1.0]
  moveit_planning_group: "arm"
  moveit_pose_link: "gripper_tcp"
  moveit_namespace: "/lbr"
  moveit_joint_names:
    - "lbr_A1"
    - "lbr_A2"
    - "lbr_A3"
    - "lbr_A4"
    - "lbr_A5"
    - "lbr_A6"
    - "lbr_A7"
  moveit_start_joint_positions: [0.0, 0.5, 0.0, -1.3962634015954636, 0.0, 1.1, 0.0]
  moveit_pipeline_id: ""
  moveit_planner_id: ""
  moveit_wait_for_moveit_timeout_s: 15.0
  moveit_ik_timeout_s: 2.0
  moveit_planning_time_s: 5.0
  moveit_num_planning_attempts: 5
  moveit_velocity_scale: 0.05
  moveit_acceleration_scale: 0.05
  moveit_execution_speed_rad_s: 0.60
  moveit_grasp_settle_time_s: 1.0
  gripper_close_duration_s: 1.5
  gripper_close_max_duration_s: 10.0
  postclose_hold_s: 1.0
  moveit_allow_collisions: true

ros2:
  pose_base_topic: "/perception/fp/pose_base/fused/assembly"
  assembly_name: "plumbers_block"
  part_id: 0
  frame_id: "world"
  timeout_s: 10.0
