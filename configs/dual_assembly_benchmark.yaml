benchmark:
  assembly: plumbers_block
  artifact_root: artifacts/dual_grasp_planning
  output_dir: artifacts/dual_assembly_benchmark/plumbers_block
  ros_domain_id: 0
  isaac_python: /media/pdz/Elements1/IsaacLab/isaaclab.sh
  max_pair_attempts: 256
  # Exact IK screens the full finite pose-feasible pool by default. Set a
  # positive value only when an operational run needs a hard screening cap.
  max_ik_screen_candidates: 0
  joint_rank_candidates: 8
  # Tuned KDL is the measured default. pick_ik remains available for explicit
  # A/B runs, but was slower on the exhaustive unreachable-pose check.
  ik_solver: kdl
  ik_timeout_s: 0.35
  # Seven covers balanced +/- A7, A1, and A3 branches from the nominal seed.
  # Active-arm diagnostic IK is cached before complete-state collision checks,
  # so this broader branch set is cheaper than the former repeated four seeds.
  exact_ik_candidates: 7
  exact_ik_beam_width: 4
  exact_ik_seed_perturbation_rad: 0.60
  pickup_approach_ik_steps: 5
  # Prefer a 10 cm standoff, but shorten only after pure pickup-chain no-IK.
  # Every fallback is rechecked through complete-state IK/collision validity.
  pickup_pregrasp_offsets_m: [0.10, 0.075, 0.05, 0.025]
  planning_time_s: 15.0
  planning_attempts: 16

# The assembled prefix stays upright at the midpoint between both robot bases.
base:
  position_world_m: [0.55, 0.0, -0.03]
  floor_z_world_m: -0.03
  yaw_deg: 0.0

# Every pickup is in front of the robots (positive world X). Negative Y assigns
# lbr_one as inserter; positive Y assigns lbr_two. The opposite arm holds.
placements:
  - id: left_inner_front
    x: 0.44
    y: -0.18
  - id: left_inner_middle
    x: 0.55
    y: -0.18
  - id: left_inner_back
    x: 0.66
    y: -0.18
  - id: left_outer_front
    x: 0.44
    y: -0.30
  - id: left_outer_middle
    x: 0.55
    y: -0.30
  - id: left_outer_back
    x: 0.66
    y: -0.30
  - id: right_inner_front
    x: 0.44
    y: 0.18
  - id: right_inner_middle
    x: 0.55
    y: 0.18
  - id: right_inner_back
    x: 0.66
    y: 0.18
  - id: right_outer_front
    x: 0.44
    y: 0.30
  - id: right_outer_middle
    x: 0.55
    y: 0.30
  - id: right_outer_back
    x: 0.66
    y: 0.30

# Z is computed per mesh/orientation so each incoming part rests on the floor.
orientations:
  - id: upright_yaw_0
    rpy_deg: [0.0, 0.0, 0.0]
  - id: upright_yaw_90
    rpy_deg: [0.0, 0.0, 90.0]
  - id: upright_yaw_180
    rpy_deg: [0.0, 0.0, 180.0]
  - id: upright_yaw_270
    rpy_deg: [0.0, 0.0, 270.0]
  - id: roll_90_yaw_0
    rpy_deg: [90.0, 0.0, 0.0]
  - id: roll_90_yaw_90
    rpy_deg: [90.0, 0.0, 90.0]
  - id: pitch_90_yaw_0
    rpy_deg: [0.0, 90.0, 0.0]
  - id: pitch_90_yaw_90
    rpy_deg: [0.0, 90.0, 90.0]

selection:
  # Empty means every holder-active assembly step.
  incoming_parts: []
  limit_cases:

# These are intentionally benchmark-specific and higher than the normal sim
# defaults so contact strength is not the limiting factor in pickup trials.
physics:
  static_friction: 5.0
  dynamic_friction: 4.0
  gripper_effort_limit: 200.0
  critical_damping_ratio: 1.0
  gripper_close_duration_s: 3.0
  finger_contact_min_force_n: 0.25
  gripper_contact_preload_m: 0.0004
