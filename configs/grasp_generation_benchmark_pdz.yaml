target_root: "obj/fabrica"

benchmark:
  output_dir: "artifacts/grasp_generation_benchmark_pdz"

stable_orientations:
  robust_tilt_deg: 5.0
  min_support_area_m2: 0.000001
  min_support_area_fraction: 0.01
  coplanar_tolerance_m: 0.000001
  xy_world: [0.0, 0.0]

planning:
  stage1_cache_enabled: true
  stage1_cache_dir: "artifacts/grasp_generation_benchmark_pdz/stage1_cache"
  num_surface_samples: 1024
  min_jaw_width: 0.008
  # PDZ pad gap is 12 mm and each finger travels 32 mm. Reserve 10 mm
  # total for the approach command, so sampled contact widths stop at 62 mm.
  max_jaw_width: 0.062
  antipodal_cosine_threshold: 0.984807753012208
  roll_angle_step_deg: 15.0
  max_pair_checks: 40960
  detailed_finger_contact_gap_m: 0.005
  gripper_collision_model: "pdz_gripper"
  floor_clearance_margin_m: 0.01
  top_grasp_score_weight: 0.35
  regrasp_transfer_top_grasp_score_weight: 0.85
  symmetry_pickup_enabled: false
  symmetry_asset_path: ""
  symmetry_max_transforms: 0
  symmetry_next_orientation_limit: 24
  contact_lateral_offsets_m: [-0.002916666666666667, 0.0, 0.002916666666666667]
  contact_approach_offsets_m: [-0.0030833333333333333, 0.0, 0.0030833333333333333]
  rng_seed: 0

geometry:
  mesh_scale: 0.01

# The execution benchmark consumes direct stage-2 bundles. Regrasp and
# handover search do not add directly executable rows and make this build much
# slower, so they are deliberately disabled in the PDZ execution dataset.
fallback:
  enabled: false

handover_fallback:
  enabled: false
