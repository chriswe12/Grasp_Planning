dataset:
  name: fabrica_all_v1
  schema_version: 1
  output_root: isaac_rl/data/fabrica_all_v1
  mesh_root: assets/obj/fabrica
  mesh_scale: 0.01

assemblies:
  beam: [0, 1, 2, 3, 6]
  car: [0, 1, 2, 3, 4, 5]
  cooling_manifold: [0, 1, 2, 3, 4, 5, 6]
  duct: [0, 1, 2, 3, 4, 5, 6, 7]
  gamepad: [0, 1, 2, 3, 4, 5]
  plumbers_block: [0, 1, 2, 3, 4]
  stool_circular: [0, 1, 2, 3, 4, 5, 6, 7, 8]

selection:
  targets_per_part_orientation: 32
  alternates_per_part_orientation: 128
  pregrasp_offset_m: 0.10
  gripper_width_clearance_m: 0.01
  min_training_jaw_width_m: 0.012
  max_training_jaw_width_m: 0.066
  minimum_pregrasp_height_m: 0.05

splits:
  train_fraction: 0.80
  validation_fraction: 0.10
  seed: 20260804
  held_out_part_fraction: 0.20
  held_out_assemblies: [gamepad]

resets:
  variants_per_target: 8
  minimum_distinct_variants: 4

shards:
  count: 4

inventory:
  simplified_mesh_face_threshold: 50000
  simplified_mesh_target_faces: 20000
  simplification_extent_tolerance_m: 0.001
