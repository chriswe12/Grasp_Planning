# Native Franka joint-velocity motion generator owns tracking.
# ROS JTC forwards Servo velocity directly, without an outer torque PID.
controller_manager:
  ros__parameters:
    update_rate: 1000
    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
franka_robot_state_broadcaster:
  ros__parameters:
    lock_try_count: 5
    lock_sleep_interval: 5
    lock_log_error: false
    lock_update_success: true
fr3_arm_controller:
  ros__parameters:
    command_interfaces:
    - velocity
    state_interfaces:
    - position
    - velocity
    joints:
    - fr3_joint1
    - fr3_joint2
    - fr3_joint3
    - fr3_joint4
    - fr3_joint5
    - fr3_joint6
    - fr3_joint7
    interpolation_method: none
    open_loop_control: false
    cmd_timeout: 0.15
    constraints:
      goal_time: 0.0
    gains:
      fr3_joint1:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint2:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint3:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint4:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint5:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint6:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
      fr3_joint7:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0
