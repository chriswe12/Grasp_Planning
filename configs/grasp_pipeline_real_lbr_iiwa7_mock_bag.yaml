geometry:
  target_mesh_path: "obj/fabrica/plumbers_block/0.obj"
  mesh_scale: 0.01
  assembly_glob: "obj/fabrica/plumbers_block/*.obj"

planning:
  stage1_cache_enabled: true
  stage1_cache_dir: "artifacts/stage1_cache"
  num_surface_samples: 256
  min_jaw_width: 0.002
  max_jaw_width: 0.09
  antipodal_cosine_threshold: 0.984807753012208
  roll_angle_step_deg: 15.0
  max_pair_checks: 40960
  detailed_finger_contact_gap_m: 0.002
  gripper_collision_model: "kuka_y_gripper"
  floor_clearance_margin_m: 0.01
  top_grasp_score_weight: 0.35
  regrasp_transfer_top_grasp_score_weight: 0.70
  reachability_proxy_score_weight: 0.15
  reachability_proxy_hand_offset_m: 0.10
  contact_lateral_offsets_m: [-0.002916666666666667, 0.0, 0.002916666666666667]
  contact_approach_offsets_m: [-0.0030833333333333333, 0.0, 0.0030833333333333333]
  rng_seed: 0

artifacts:
  stage1_json: "artifacts/real_lbr_mock_bag_pipeline_stage1_assembly_grasps.json"
  stage1_html: "artifacts/real_lbr_mock_bag_pipeline_stage1_assembly_grasps.html"
  stage2_json: "artifacts/real_lbr_mock_bag_pipeline_stage2_ground_feasible.json"
  stage2_html: "artifacts/real_lbr_mock_bag_pipeline_stage2_ground_feasible.html"
  part_frame_html: "artifacts/real_lbr_mock_bag_pipeline_part_frame_debug.html"

mujoco_execution:
  enabled: false
  python_executable: ""
  robot_config: ""
  simulation_config: ""
  controller: "native"
  grasp_id: ""
  attempt_artifact: "artifacts/real_lbr_mock_bag_mujoco_pick_attempt.json"
  viewer: false

# Perception is replayed from ~/Desktop/test_bag_moveit_vision instead of a live
# FoundationPose process: `ros2 bag play ~/Desktop/test_bag_moveit_vision
# --topics /perception/fp/pose_base/fused/assembly` publishes plumbers_block/0
# DebugPoseItem messages on this same topic within the timeout window below.
ros2:
  pose_base_topic: "/perception/fp/pose_base/fused/assembly"
  assembly_name: "plumbers_block"
  part_id: 0
  # Temporary perception-base -> left LBR base translation, applied before planning.
  position_offset_m: [0.0, -0.840, 0.0]
  frame_id: "world"
  timeout_s: 40.0

grasp_assembly_action:
  action_name: "/grasp_assembly"
  output_root: "artifacts/grasp_assembly_actions"

real_execution:
  enabled: true
  grasp_id: ""
  attempt_artifact: "artifacts/real_lbr_mock_bag_robot_pick_attempt.json"
  planning_group: "arm"
  pose_link: "gripper_tcp"
  moveit_namespace: "/lbr"
  joint_names:
    - "lbr_A1"
    - "lbr_A2"
    - "lbr_A3"
    - "lbr_A4"
    - "lbr_A5"
    - "lbr_A6"
    - "lbr_A7"
  frame_id: "lbr_link_0"
  wait_for_moveit_timeout_s: 15.0
  # "direct" (default) matches prior behavior: one compute_ik call per
  # target. Set to "cartesian_waypoints" to instead walk each target through
  # cartesian_waypoint_count linearly interpolated Cartesian poses, seeding
  # each waypoint's IK with the previous waypoint's solution - useful when a
  # direct compute_ik call reports no IK solution but the target may still
  # be reachable via a nearer seed. See
  # grasp_planning/pipeline/cartesian_waypoint_ik.py.
  ik_strategy: "direct"
  cartesian_waypoint_count: 10
  ik_timeout_s: 2.0
  planning_time_s: 5.0
  num_planning_attempts: 5
  velocity_scale: 0.05
  acceleration_scale: 0.05
  execute_timeout_s: 120.0
  post_execute_sleep_s: 0.5
  pregrasp_offset_m: 0.10
  gripper_width_clearance_m: 0.01
  lift_height_m: 0.08
  require_confirmation: true
  stop_after: "lift"
  allow_collisions: false
  planning_scene_obstacles:
    - id: "floor"
      type: "box"
      frame_id: "lbr_link_0"
      size_m: [2.0, 2.0, 0.02]
      xyz: [0.0, 0.0, -0.01]
      rpy: [0.0, 0.0, 0.0]
    - id: "rear_wall"
      type: "box"
      frame_id: "lbr_link_0"
      size_m: [2.0, 0.04, 1.5]
      xyz: [0.0, -0.75, 0.75]
      rpy: [0.0, 0.0, 0.0]
  # No /gripper_controller/{open,close,stop} services exist under the mock
  # aligned_lbr_moveit.launch.py stack, so real_grasp_executor would fail at the
  # post-confirmation gripper.wait_for_server() call before any MoveIt motion runs.
  # Disabled here since this config is for visualizing MoveIt planning/execution
  # against mock hardware, not actuating a real gripper.
  gripper_enabled: false
  gripper_client: "trigger_service"
  gripper_trigger_open_service: "/gripper_controller/open"
  gripper_trigger_close_service: "/gripper_controller/close"
  gripper_trigger_stop_service: "/gripper_controller/stop"
  gripper_open_width: 0.08
  gripper_grasp_speed: 0.03
  gripper_grasp_force: 30.0
  gripper_epsilon_inner: 0.002
  gripper_epsilon_outer: 0.08
  gripper_timeout_s: 12.0  # service may block internally for up to 10 seconds
  grasp_settle_time_s: 0.5
