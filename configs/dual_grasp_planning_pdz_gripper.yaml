# Full offline three-stage collision build for the KUKA iiwa7 + PDZ gripper.
assembly:
  name: plumbers_block
  asset_root: assets/obj/fabrica
  mesh_scale: 0.01
  table_z_assembly_m: 0.0
  table_contact_tolerance_m: 0.000001

artifacts:
  output_root: artifacts/dual_grasp_planning_pdz_gripper

planning:
  stage1_cache_enabled: true
  stage1_cache_dir: artifacts/dual_grasp_planning_pdz_gripper/stage1_cache
  num_surface_samples: 1024
  min_jaw_width: 0.008
  # 76 mm physical PDZ opening; 62 mm contact width plus 10 mm approach
  # clearance leaves 4 mm of travel margin.
  max_jaw_width: 0.062
  antipodal_cosine_threshold: 0.984807753012208
  roll_angle_step_deg: 15.0
  max_pair_checks: 40960
  detailed_finger_contact_gap_m: 0.005
  gripper_collision_model: pdz_gripper
  contact_lateral_offsets_m: [-0.002916666666666667, 0.0, 0.002916666666666667]
  contact_approach_offsets_m: [-0.0030833333333333333, 0.0, 0.0030833333333333333]
  symmetry_pickup_enabled: true
  symmetry_max_transforms: 0
  rng_seed: 0

holder_feasibility:
  pregrasp_offset_m: 0.05
  table_clearance_margin_m: 0.002
  geometry_clearance_margin_m: 0.0
  incoming_path_samples: 21

pair_planning:
  # Trapezoidal robust contact patches: bottom/far from hand is ±5 mm;
  # top/closer to hand is ±15 mm across a 10 mm approach span.
  inserter_contact_offset_pairs_m:
    - [-0.005, -0.005]
    - [0.0, -0.005]
    - [0.005, -0.005]
    - [-0.015, 0.005]
    - [0.0, 0.005]
    - [0.015, 0.005]
  stage3_worker_count: 0
  adaptive_inserter_shortlist: true
  prefer_aabb_clear_inserter_candidates: true
  balance_inserter_approach_directions: true
  balance_inserter_symmetry_transforms: true
  exact_pair_clearance_ranking: true
  max_holder_candidates_per_step: 80
  max_inserter_candidates_per_step: 512
  max_candidates_per_cluster: 5
  contact_position_bin_m: 0.025
  axis_bin_deg: 30.0
  max_pair_checks: 16000
  max_accepted_pairs: 256
  max_rejected_pairs: 200
  max_collision_diagnostics_per_step: 24
  max_pairs_per_holder: 4
  max_pairs_per_inserter: 4
  matrix_unary_rejections_per_side: 12
  table_clearance_margin_m: 0.002
  geometry_clearance_margin_m: 0.0
  retreat_distance_m: 0.05
  path_samples: 21
  holder_score_weight: 0.45
  inserter_score_weight: 0.45
  clearance_score_weight: 0.10
  clearance_score_saturation_m: 0.05
  transition_symmetry_enabled: true
  transition_symmetry_geometry_tolerance_m: 0.001
  transition_symmetry_max_partial_assembly_transforms: 0
  transition_symmetry_max_incoming_transforms: 0
